services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "${PAYMENTS_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${PAYMENTS_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      REDIS_URL: redis://redis:6379/0
      DEMO_SECRET: change-me
      AUTO_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PAYMENTS_BACKEND_PORT:-18000}:8000"
    command: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ../backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://payments:payments@postgres:5432/payments
      REDIS_URL: redis://redis:6379/0
      DEMO_SECRET: change-me
      AUTO_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >-
      sh -c "celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=1"

  dashboard:
    build:
      context: ../dashboard
    environment:
      VITE_API_URL: http://localhost:${PAYMENTS_BACKEND_PORT:-18000}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${PAYMENTS_DASHBOARD_PORT:-5174}:5173"

volumes:
  postgres_data:
